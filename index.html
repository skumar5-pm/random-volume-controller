<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weird Volume Controller</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SR5N94WMG5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SR5N94WMG5');
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding-top: 30px;
    }

    h2 { margin-bottom: 10px; }

    /* Name input styling */
    .name-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .name-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    #nameInput {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      color: #00ffcc;
      font-family: Arial;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 14px;
      text-align: center;
      width: 220px;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    #nameInput:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.15);
    }

    .dial {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 10px solid #444;
      position: relative;
      cursor: pointer;
      margin-top: 20px;
    }

    .needle {
      width: 4px;
      height: 90px;
      background: #00ffcc;
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
    }

    .value {
      margin-top: 15px;
      font-size: 20px;
    }

    .bar {
      display: flex;
      gap: 4px;
      margin-top: 20px;
    }

    .block {
      width: 8px;
      height: 10px;
      background: #333;
      transition: all 0.2s ease;
    }

    .block.active {
      background: #00ffcc;
      height: 20px;
      transform: rotate(calc(var(--i) * 10deg));
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #00ffcc;
      color: black;
      font-weight: bold;
    }

    #leaderboard {
      margin-top: 30px;
      width: 80%;
      max-width: 300px;
      text-align: left;
    }

    .entry {
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }
  </style>
</head>

<body>

<h2>Weird Volume Controller 🎛️</h2>

<!-- Name input (always visible, editable) -->
<div class="name-wrap">
  <label for="nameInput" class="name-label">YOUR NAME</label>
  <input type="text" id="nameInput" maxlength="30" autocomplete="off" />
</div>

<div id="dial" class="dial">
  <div id="needle" class="needle"></div>
</div>

<div class="value" id="value">Volume: 0</div>
<div class="bar" id="bar"></div>

<!-- Always visible Share -->
<button onclick="share()">Share</button>

<!-- Leaderboard -->
<div id="leaderboard"></div>

<audio id="audio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
  const dial = document.getElementById('dial');
  const needle = document.getElementById('needle');
  const valueText = document.getElementById('value');
  const bar = document.getElementById('bar');
  const audio = document.getElementById('audio');
  const nameInput = document.getElementById('nameInput');

  let volume = 0;
  let started = false;

  function track(name, params={}) {
    if(window.gtag) gtag('event', name, params);
  }

  // blocks
  for(let i=0;i<20;i++){
    const b=document.createElement('div');
    b.className='block';
    b.style.setProperty('--i', i);
    bar.appendChild(b);
  }

  const blocks = document.querySelectorAll('.block');

  function updateUI(){
    needle.style.transform=`rotate(${volume*2.7}deg)`;
    valueText.innerText=`Volume: ${volume}`;

    blocks.forEach((b,i)=>{
      b.classList.toggle('active', i < volume/5);
    });

    audio.volume = volume/100;
  }

  dial.addEventListener('mousedown',()=>{
    if(!started){
      audio.play();
      track('volume_interaction_start');
      started=true;
    }
  });

  dial.addEventListener('mousemove',(e)=>{
    if(e.buttons!==1) return;

    const rect=dial.getBoundingClientRect();
    const x=e.clientX-rect.left-rect.width/2;
    const y=e.clientY-rect.top-rect.height/2;

    let angle=Math.atan2(y,x)*(180/Math.PI)+180;
    volume=Math.min(100, Math.floor(angle/3.6));

    updateUI();

    saveScore(volume);
  });

  // ---------- NAME HANDLING ----------

  const SUGGESTIONS = ["Funky DJ", "Sound Ninja", "Volume King"];

  function randomSuggestion(){
    return SUGGESTIONS[Math.floor(Math.random() * SUGGESTIONS.length)];
  }

  // Initialize the input: saved name if any, else a random suggestion (also persisted)
  function initName(){
    let name = localStorage.getItem('name');
    if(!name){
      name = randomSuggestion();
      localStorage.setItem('name', name);
    }
    nameInput.value = name;
  }

  function getName(){
    // Always read latest from input; fall back to storage if somehow empty
    const v = (nameInput.value || '').trim();
    if(v) return v;
    return localStorage.getItem('name') || randomSuggestion();
  }

  // Save name as the user types (debounced) and refresh leaderboard label
  let nameSaveTimer;
  nameInput.addEventListener('input', () => {
    clearTimeout(nameSaveTimer);
    nameSaveTimer = setTimeout(() => {
      const v = (nameInput.value || '').trim();
      if(v) localStorage.setItem('name', v);
      renderLeaderboard();
    }, 200);
  });

  // If user leaves the field empty, restore a suggestion on blur
  nameInput.addEventListener('blur', () => {
    if(!nameInput.value.trim()){
      const s = randomSuggestion();
      nameInput.value = s;
      localStorage.setItem('name', s);
      renderLeaderboard();
    }
  });

  // ---------- SCORES ----------

  function saveScore(v){
    const name = getName();

    let data = JSON.parse(localStorage.getItem("scores") || "[]");

    const existing = data.find(d => d.name === name);

    if(!existing || v > existing.volume){
      data = data.filter(d => d.name !== name);
      data.push({
        name: name,
        volume: v,
        time: Date.now()
      });

      localStorage.setItem("scores", JSON.stringify(data));
    }

    renderLeaderboard();
  }

  function renderLeaderboard(){
    let data = JSON.parse(localStorage.getItem("scores") || "[]");

    data.sort((a,b)=>{
      if(b.volume !== a.volume) return b.volume - a.volume;
      return b.time - a.time;
    });

    const top = data.slice(0,5);

    const el = document.getElementById("leaderboard");

    el.innerHTML = "<h3>🏆 Leaderboard</h3>" +
      top.map(d => `<div class="entry">${d.name} — ${d.volume}</div>`).join('');
  }

  // SHARE
  function share(){
    const best = getBestVolume();

    const text = `I could reach till ${best}. You can reach 100. Try now: ${location.href}`;

    navigator.clipboard.writeText(text);
    alert("Copied!");

    track('share_clicked', { volume: best });
  }

  function getBestVolume(){
    let data = JSON.parse(localStorage.getItem("scores") || "[]");
    const name = getName();

    const user = data.find(d => d.name === name);
    return user ? user.volume : 0;
  }

  // Boot
  initName();
  renderLeaderboard();
</script>

</body>
</html>
