<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Volume Controller</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;

      /* Option 2 background */
      background: #f5f7fb;
      background-image: radial-gradient(#dbeafe 1px, transparent 1px);
      background-size: 20px 20px;

      color: #111827;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 320px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .volume {
      font-size: 18px;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>🎛 Random Volume Controller</h1>

    <button onclick="changeVolume()">Randomize Volume</button>

    <div class="volume" id="volumeText">Volume: 50%</div>
  </div>

  <script>
    function changeVolume() {
      const randomVolume = Math.floor(Math.random() * 101); // 0–100
      document.getElementById("volumeText").innerText =
        "Volume: " + randomVolume + "%";
    }
  </script>

</body>
</html>
