<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weird Volume Controller</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SR5N94WMG5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SR5N94WMG5');
  </script>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      padding-top: 30px;
    }

    h2 { margin-bottom: 10px; }

    .name-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .name-label {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    #nameInput {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 8px;
      color: #00ffcc;
      font-family: Arial;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 14px;
      text-align: center;
      width: 220px;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    #nameInput:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 0 3px rgba(0, 255, 204, 0.15);
    }

    .dial {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 10px solid #444;
      position: relative;
      cursor: pointer;
      margin-top: 20px;
    }

    .needle {
      width: 4px;
      height: 90px;
      background: #00ffcc;
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
    }

    .value {
      margin-top: 15px;
      font-size: 20px;
    }

    .bar {
      display: flex;
      gap: 4px;
      margin-top: 20px;
    }

    .block {
      width: 8px;
      height: 10px;
      background: #333;
      transition: all 0.2s ease;
    }

    .block.active {
      background: #00ffcc;
      height: 20px;
      transform: rotate(calc(var(--i) * 10deg));
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #00ffcc;
      color: black;
      font-weight: bold;
    }

    #leaderboard {
      margin-top: 30px;
      width: 80%;
      max-width: 300px;
      text-align: left;
    }

    .entry {
      padding: 6px 0;
      border-bottom: 1px solid #333;
    }

    .lb-status {
      color: #888;
      font-size: 13px;
      font-style: italic;
      padding: 6px 0;
    }
  </style>
</head>

<body>

<h2>Weird Volume Controller 🎛️</h2>

<div class="name-wrap">
  <label for="nameInput" class="name-label">YOUR NAME</label>
  <input type="text" id="nameInput" maxlength="30" autocomplete="off" />
</div>

<div id="dial" class="dial">
  <div id="needle" class="needle"></div>
</div>

<div class="value" id="value">Volume: 0</div>
<div class="bar" id="bar"></div>

<button onclick="share()">Share</button>

<div id="leaderboard"></div>

<audio id="audio" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
  // ============ SUPABASE CONFIG — FILL THESE IN ============
  const SUPABASE_URL = 'https://xdbxpmmegyfbxacepaio.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkYnhwbW1lZ3lmYnhhY2VwYWlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMTczNTAsImV4cCI6MjA5Mjc5MzM1MH0.H1g1uSaUsQHtTxACF5TjMTApoFTXwgJZtUKPF1zuhSM';
  // =========================================================

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const dial = document.getElementById('dial');
  const needle = document.getElementById('needle');
  const valueText = document.getElementById('value');
  const bar = document.getElementById('bar');
  const audio = document.getElementById('audio');
  const nameInput = document.getElementById('nameInput');

  let volume = 0;
  let started = false;

  function track(name, params={}) {
    if(window.gtag) gtag('event', name, params);
  }

  // Build the visualizer blocks
  for(let i=0;i<20;i++){
    const b=document.createElement('div');
    b.className='block';
    b.style.setProperty('--i', i);
    bar.appendChild(b);
  }
  const blocks = document.querySelectorAll('.block');

  function updateUI(){
    needle.style.transform=`rotate(${volume*2.7}deg)`;
    valueText.innerText=`Volume: ${volume}`;
    blocks.forEach((b,i)=>{
      b.classList.toggle('active', i < volume/5);
    });
    audio.volume = volume/100;
  }

  dial.addEventListener('mousedown',()=>{
    if(!started){
      audio.play();
      track('volume_interaction_start');
      started=true;
    }
  });

  // ---------- DWELL-BASED COMMIT ----------
  const DWELL_MS = 2000;
  let dwellTimer = null;
  let pendingVolume = null;

  function scheduleCommit(v){
    pendingVolume = v;
    clearTimeout(dwellTimer);
    dwellTimer = setTimeout(() => {
      if(pendingVolume !== null){
        saveScore(pendingVolume);
        pendingVolume = null;
      }
    }, DWELL_MS);
  }

  function commitNow(){
    clearTimeout(dwellTimer);
    if(pendingVolume !== null){
      saveScore(pendingVolume);
      pendingVolume = null;
    }
  }

  dial.addEventListener('mousemove',(e)=>{
    if(e.buttons!==1) return;
    const rect=dial.getBoundingClientRect();
    const x=e.clientX-rect.left-rect.width/2;
    const y=e.clientY-rect.top-rect.height/2;
    let angle=Math.atan2(y,x)*(180/Math.PI)+180;
    volume=Math.min(100, Math.floor(angle/3.6));
    updateUI();
    scheduleCommit(volume);
  });

  window.addEventListener('mouseup', commitNow);

  // ---------- NAME HANDLING ----------
  const SUGGESTIONS = ["Funky DJ", "Sound Ninja", "Volume King"];
  function randomSuggestion(){
    return SUGGESTIONS[Math.floor(Math.random() * SUGGESTIONS.length)];
  }

  function initName(){
    let name = localStorage.getItem('name');
    if(!name){
      name = randomSuggestion();
      localStorage.setItem('name', name);
    }
    nameInput.value = name;
  }

  function getName(){
    const v = (nameInput.value || '').trim();
    if(v) return v;
    return localStorage.getItem('name') || randomSuggestion();
  }

  let nameSaveTimer;
  nameInput.addEventListener('input', () => {
    clearTimeout(nameSaveTimer);
    nameSaveTimer = setTimeout(() => {
      const v = (nameInput.value || '').trim();
      if(v) localStorage.setItem('name', v);
      renderLeaderboard();
    }, 200);
  });

  nameInput.addEventListener('blur', () => {
    if(!nameInput.value.trim()){
      const s = randomSuggestion();
      nameInput.value = s;
      localStorage.setItem('name', s);
      renderLeaderboard();
    }
  });

  // ---------- SCORES (GLOBAL via Supabase) ----------

  function getLocalBest(){
    return parseInt(localStorage.getItem('myBest') || '0', 10);
  }
  function setLocalBest(v){
    if(v > getLocalBest()) localStorage.setItem('myBest', String(v));
  }

  async function saveScore(v){
    const name = getName();
    setLocalBest(v);

    try {
      const { error } = await sb
        .from('scores')
        .insert({ name: name, volume: v });

      if(error){
        console.warn('Supabase insert failed:', error.message);
        return;
      }
      renderLeaderboard();
    } catch(err){
      console.warn('Network error saving score:', err);
    }
  }

  async function renderLeaderboard(){
    const el = document.getElementById('leaderboard');
    el.innerHTML = "<h3>🏆 Global Leaderboard</h3><div class='lb-status'>Loading…</div>";

    try {
      const { data, error } = await sb
        .from('scores')
        .select('name, volume, created_at')
        .order('volume', { ascending: false })
        .order('created_at', { ascending: false })
        .limit(100);

      if(error) throw error;

      // Keep only each player's best score
      const bestByName = new Map();
      for(const row of data){
        const prev = bestByName.get(row.name);
        if(!prev || row.volume > prev.volume){
          bestByName.set(row.name, row);
        }
      }

      const top = Array.from(bestByName.values())
        .sort((a,b) => b.volume - a.volume || new Date(b.created_at) - new Date(a.created_at))
        .slice(0,5);

      if(top.length === 0){
        el.innerHTML = "<h3>🏆 Global Leaderboard</h3><div class='lb-status'>No scores yet — be the first!</div>";
        return;
      }

      el.innerHTML = "<h3>🏆 Global Leaderboard</h3>" +
        top.map(d => `<div class="entry">${escapeHtml(d.name)} — ${d.volume}</div>`).join('');
    } catch(err){
      console.warn('Leaderboard load failed:', err);
      el.innerHTML = "<h3>🏆 Global Leaderboard</h3><div class='lb-status'>Couldn't load leaderboard.</div>";
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- SHARE ----------
  function share(){
    const best = getLocalBest();
    const text = `I could reach till ${best}. You can reach 100. Try now: ${location.href}`;
    navigator.clipboard.writeText(text);
    alert("Copied!");
    track('share_clicked', { volume: best });
  }

  // Boot
  initName();
  renderLeaderboard();
</script>

</body>
</html>
